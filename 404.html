<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta name="robots" content="noindex"/>
    <meta name="theme-color" content="#0a0e1a"/>
    <title>Page not found — Yunus Emre Yaşar</title>
    <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
          rel="stylesheet"/>
    <script src="/js/icons.js" defer></script>
    <link href="/css/styles.css" rel="stylesheet"/>
    <style>
        .nf { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 2rem 1.2rem; }
        .nf__code { font: 700 clamp(5rem, 22vw, 10rem)/1 var(--font-display); background: var(--gradient);
                    -webkit-background-clip: text; background-clip: text; color: transparent; letter-spacing: -.04em; }
        .nf h1 { font: 700 clamp(1.5rem, 4vw, 2.1rem) var(--font-display); margin: .6rem 0 .4rem; }
        .nf p { color: var(--text-soft); margin: 0 auto 2rem; max-width: 460px; }
        .nf .hero__cta { justify-content: center; }
        .nf__tr { margin-top: 2.6rem; color: var(--text-dim); font-size: .9rem; }
        .nf__tr a { color: var(--cyan); }
    </style>
</head>
<body>
<main class="nf">
    <div>
        <div class="nf__code" aria-hidden="true">404</div>
        <h1>This page wandered off</h1>
        <p>The link may be old or mistyped. Everything else is still where it was.</p>
        <div class="hero__cta">
            <a href="/" class="btn btn--primary"><i class="fas fa-circle-notch"></i> Home</a>
            <a href="/#projects" class="btn btn--ghost"><i class="fas fa-project-diagram"></i> Projects</a>
            <a href="/#opensource" class="btn btn--ghost"><i class="fas fa-code-branch"></i> Open source</a>
        </div>
        <p class="nf__tr">Bu sayfa bulunamadı. <a href="/tr/">Türkçe ana sayfaya dön →</a></p>
    </div>
</main>
</body>
</html>
