<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
    <meta name="robots" content="noindex, nofollow"/>
    <meta name="theme-color" content="#0d0a0f"/>
    <title>Resim Bulmaca</title>
    <link rel="icon" href="data:,"/>

    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap"
          rel="stylesheet"/>

    <link href="style.css" rel="stylesheet"/>
</head>

<body class="game-page">

<div class="glow" aria-hidden="true"></div>

<main class="game-stage">

    <header class="game-hud">
        <a class="back-link" href="./" aria-label="Oyun köşesine dön">← oyunlar</a>
        <div class="hud-stats">
            <span><small>çözülen</small><b id="solved">0</b></span>
            <span><small>süre</small><b id="time">0:00</b></span>
        </div>
    </header>

    <div class="chips" id="levels" role="group" aria-label="Bölümler"></div>

    <div class="board board--center">
        <div class="nono" id="grid" aria-label="Resim bulmacası"></div>

        <div class="overlay hidden" id="overlay">
            <h1 class="overlay__title" id="ovTitle"></h1>
            <p class="overlay__text" id="ovText"></p>
            <button class="play-btn" id="playBtn" type="button">sonraki resim</button>
        </div>
    </div>

    <div class="game-foot">
        <button class="ghost-btn" id="modeBtn" type="button">■ boya</button>
        <p class="hint hint--game">sayılar, o satırda yan yana kaç kare boyanacağını söyler</p>
        <button class="ghost-btn" id="clearBtn" type="button">temizle</button>
    </div>

</main>

<script src="common.js"></script>
<script src="resim.js"></script>
</body>
</html>
