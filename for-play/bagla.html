<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
    <meta name="robots" content="noindex, nofollow"/>
    <meta name="theme-color" content="#0d0a0f"/>
    <title>Bağla</title>
    <link rel="icon" href="data:,"/>

    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap"
          rel="stylesheet"/>

    <link href="style.css" rel="stylesheet"/>
</head>

<body class="game-page">

<div class="glow" aria-hidden="true"></div>

<main class="game-stage">

    <header class="game-hud">
        <a class="back-link" href="./" aria-label="Oyun köşesine dön">← oyunlar</a>
        <div class="hud-stats">
            <span><small>dolu</small><b id="fill">0%</b></span>
            <span><small>çözülen</small><b id="best">0</b></span>
        </div>
    </header>

    <div class="chips" id="sizes" role="group" aria-label="Boyut"><button type="button" class="chip" data-v="5">5×5</button><button type="button" class="chip" data-v="6">6×6</button><button type="button" class="chip" data-v="7">7×7</button><button type="button" class="chip" data-v="8">8×8</button></div>

    <div class="board board--center">
        <canvas id="game" class="game-canvas game-canvas--square" aria-label="Renk bağlama bulmacası"></canvas>

        <div class="overlay hidden" id="overlay">
            <h1 class="overlay__title" id="ovTitle"></h1>
            <p class="overlay__text" id="ovText"></p>
            <button class="play-btn" id="playBtn" type="button">sonraki bölüm</button>
        </div>
    </div>

    <div class="game-foot">
        <p class="hint hint--game">aynı renkleri birleştir, bütün kareleri doldur</p>
        <button class="ghost-btn" id="newBtn" type="button">yeni bölüm</button>
    </div>

</main>

<script src="common.js"></script>
<script src="bagla.js"></script>
</body>
</html>
